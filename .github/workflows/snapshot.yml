name: Capture WezTerm snapshot

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New snapshot tag (snapshot-YYYYMMDD or snapshot-YYYYMMDD-N)
        required: true
        type: string
      base_tag:
        description: Published snapshot to use as the base (defaults to the latest published snapshot)
        type: string
      create_draft:
        description: Stage a draft release after verification
        type: boolean
        default: true

permissions: {}

concurrency:
  group: wezterm-snapshot-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.repository == 'cgraf78/wezterm-builds' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      SNAPSHOT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag availability and download the base manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BASE_TAG: ${{ inputs.base_tag }}
        run: |
          valid_tag() {
            [[ $1 =~ ^snapshot-([0-9]{4})([0-9]{2})([0-9]{2})(-[1-9][0-9]*)?$ ]] &&
              date -u -d "${BASH_REMATCH[1]}-${BASH_REMATCH[2]}-${BASH_REMATCH[3]}" >/dev/null 2>&1
          }
          if ! valid_tag "$SNAPSHOT_TAG" ||
            { [[ -n $REQUESTED_BASE_TAG ]] && ! valid_tag "$REQUESTED_BASE_TAG"; }; then
            printf 'Use a valid date in snapshot-YYYYMMDD or snapshot-YYYYMMDD-N.\n' >&2
            exit 1
          fi

          releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          release_exists=$(jq --arg tag "$SNAPSHOT_TAG" 'any(.[][]; .tag_name == $tag)' <<< "$releases")
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$SNAPSHOT_TAG" --jq '.[].ref')
          if [[ $release_exists == true ]] || grep -Fxq -- "refs/tags/$SNAPSHOT_TAG" <<< "$refs"; then
            printf 'A release or Git tag already exists for %s.\n' "$SNAPSHOT_TAG" >&2
            exit 1
          fi

          base_tag=$(jq -r --arg requested "$REQUESTED_BASE_TAG" '
            [.[][] | select(.draft == false and .published_at != null and .immutable == true) |
              select(.tag_name | test("^snapshot-[0-9]{8}(-[1-9][0-9]*)?$")) |
              select($requested == "" or .tag_name == $requested)] |
            max_by(.published_at).tag_name // empty
          ' <<< "$releases")
          if ! valid_tag "$base_tag"; then
            printf 'No published immutable base matches the request. Publish the initial snapshot with immutable releases enabled first.\n' >&2
            exit 1
          fi
          gh release download "$base_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern snapshot.lock --output "$RUNNER_TEMP/base-snapshot.lock"
          gh api repos/wezterm/wezterm/releases/tags/nightly > "$RUNNER_TEMP/nightly.json"
          printf 'BASE_TAG=%s\n' "$base_tag" >> "$GITHUB_ENV"

      - name: Install package inspection tools and run tests
        run: |
          if ! command -v rpm >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends rpm
          fi
          python3 -m unittest discover -s tests

      - name: Capture and verify the snapshot
        run: |
          snapshot_dir=$RUNNER_TEMP/wezterm-snapshot
          python3 scripts/snapshot.py capture --base-manifest "$RUNNER_TEMP/base-snapshot.lock" \
            --nightly-metadata "$RUNNER_TEMP/nightly.json" \
            --base-tag "$BASE_TAG" --tag "$SNAPSHOT_TAG" --output "$snapshot_dir"
          cd "$snapshot_dir"
          sha256sum --check --strict SHA256SUMS
          {
            printf "## Verified WezTerm snapshot \`%s\`\n\n" "$SNAPSHOT_TAG"
            printf "Base snapshot \`%s\`, %s verified assets.\n\n" "$BASE_TAG" "$(wc -l < SHA256SUMS)"
            printf "Workflow commit \`%s\`.\n\n" "$GITHUB_SHA"
            printf '```text\n'
            awk '!/^#/ && NF { print $1, $2 }' snapshot.lock | sort -u
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage a draft release for review
        if: inputs.create_draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          # A maintainer can create a release outside this workflow during capture.
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$SNAPSHOT_TAG" --jq '.[].ref')
          if grep -Fxq -- "$SNAPSHOT_TAG" <<< "$releases" || grep -Fxq -- "refs/tags/$SNAPSHOT_TAG" <<< "$refs"; then
            printf 'A release or Git tag already exists for %s.\n' "$SNAPSHOT_TAG" >&2
            exit 1
          fi

          notes=$(printf "WezTerm snapshot captured from the original publishers using \`%s\` as the base.\n\n\`snapshot.lock\` records asset provenance and \`SHA256SUMS\` verifies the original files.\n" "$BASE_TAG")
          files=("$RUNNER_TEMP/wezterm-snapshot/"* LICENSE.md licenses/LICENSE_OFL.txt licenses/LICENSE_POWERLINE_EXTRA.txt)
          gh release create "$SNAPSHOT_TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "$SNAPSHOT_TAG" --notes "$notes" >> "$GITHUB_STEP_SUMMARY"

          release_id=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -er --arg tag "$SNAPSHOT_TAG" '[.[][] | select(.tag_name == $tag and .draft)] | if length == 1 then .[0].id else error("expected one draft") end')
          uploaded=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" |
            jq -er --arg commit "$GITHUB_SHA" '
              if .target_commitish == $commit then
                .assets[] | select(.state == "uploaded") | "\(.digest)  \(.name)"
              else error("draft targets the wrong commit") end
            ' | sort)
          expected=$(for file in "${files[@]}"; do
            sum=$(sha256sum "$file")
            printf 'sha256:%s  %s\n' "${sum%% *}" "${file##*/}"
          done | sort)
          if [[ $uploaded != "$expected" ]]; then
            printf 'Draft asset inventory or digests do not match the verified snapshot.\n' >&2
            exit 1
          fi
